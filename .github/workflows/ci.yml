name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  gate:
    name: CI
    runs-on: ubuntu-24.04
    if: always()
    needs: validate
    steps:
      - name: Require every validation job
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success